experiment_name: fusion_hi2mr
direction: hi2mr
architecture:
  model_type: transformer_fusion
  embed_dim: 768
  num_layers: 6 (decoder fusion layers)
  num_heads: 12
  num_kv_heads: 4
  mlp_ratio: 4
  dropout: 0.1
  encoder_init: bert_pretrain/latest_model.pt (frozen)
  decoder_init: gpt2_pretrain/latest_model.pt
  positional_embeddings: RoPE
  attention: GQA
  normalization: RMSNorm
  activation: SwiGLU
training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.01
data:
  tokenizer: sentencepiece_bpe_32k
  max_len: 128
